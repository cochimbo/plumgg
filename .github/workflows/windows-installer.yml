name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VERSION: 2.30.9
  APP_EXE: plumgg.exe

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for emulator sources
        id: src
        shell: pwsh
        run: |
          if (Test-Path CMakeLists.txt) { "present=true" >> $env:GITHUB_OUTPUT }
          else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::No CMakeLists.txt at the repo root yet; skipping the installer build."
          }

      - name: Download SDL2 (MSVC development package)
        if: steps.src.outputs.present == 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sdl2.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sdl2"
          "SDL2_ROOT=$env:RUNNER_TEMP\sdl2\SDL2-$env:SDL2_VERSION" >> $env:GITHUB_ENV

      - name: Build emulator (Release)
        if: steps.src.outputs.present == 'true'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=$env:SDL2_ROOT/cmake" "-DSDL2_DIR=$env:SDL2_ROOT/cmake"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Stage files for the installer
        if: steps.src.outputs.present == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exes = Get-ChildItem build -Recurse -Filter *.exe | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' }
          $exe = $exes | Where-Object Name -eq $env:APP_EXE | Select-Object -First 1
          if (-not $exe) {
            if ($exes.Count -ne 1) {
              Write-Host "::error::Could not find $env:APP_EXE in build/. Found: $($exes.Name -join ', ')"
              exit 1
            }
            $exe = $exes[0]
            Write-Host "::warning::$env:APP_EXE not found; packaging $($exe.Name) instead."
            "APP_EXE=$($exe.Name)" >> $env:GITHUB_ENV
          }
          Copy-Item $exe.FullName dist\
          # Prefer an SDL2.dll produced by the build (e.g. FetchContent); else use the downloaded one.
          $dll = Get-ChildItem build -Recurse -Filter SDL2.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist\ } else { Copy-Item "$env:SDL2_ROOT\lib\x64\SDL2.dll" dist\ }
          if (Test-Path "$env:SDL2_ROOT\README-SDL.txt") { Copy-Item "$env:SDL2_ROOT\README-SDL.txt" dist\ }
          Get-ChildItem dist

      - name: Compute version
        if: steps.src.outputs.present == 'true'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build installer (Inno Setup)
        if: steps.src.outputs.present == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppExeName=$env:APP_EXE" "/DSourceDir=$env:GITHUB_WORKSPACE\dist" "/DOutputDir=$env:GITHUB_WORKSPACE\dist-installer" installer\plumgg.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload installer
        if: steps.src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plumgg-windows-installer
          path: dist-installer/*.exe

      - name: Attach installer to release
        if: steps.src.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
